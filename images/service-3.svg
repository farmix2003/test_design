<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgS3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142e1e"/>
      <stop offset="100%" stop-color="#0a1910"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgS3)"/>
  <!-- Smartphone with social media icons -->
  <g transform="translate(180, 40)">
    <!-- Phone body -->
    <rect x="50" y="20" width="140" height="250" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3" transform="rotate(-15, 120, 145)"/>
    <!-- Screen -->
    <rect x="60" y="35" width="120" height="220" rx="10" fill="#0284c7" opacity="0.8" transform="rotate(-15, 120, 145)"/>
    <!-- Floating social badge notifications -->
    <rect x="20" y="60" width="55" height="32" rx="16" fill="#ec4899"/>
    <text x="35" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">♥ 25</text>
    
    <rect x="150" y="110" width="50" height="30" rx="15" fill="#3b82f6"/>
    <text x="162" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">@ 9</text>
  </g>
  <!-- Business person hand holding device -->
  <ellipse cx="380" cy="260" rx="50" ry="35" fill="#fbd5b5" transform="rotate(-15, 380, 260)"/>
</svg>
